name: lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ansible and ansible-lint
        run: pip install ansible ansible-lint==26.4.0
      - name: Lint
        run: make lint
