---
- name: Install Go via Homebrew (macOS)
  when: ansible_facts["os_family"] == "Darwin"
  block:
    - name: Install Go
      community.general.homebrew:
        name: go
        state: present

    # A previous version of this role installed a pinned tarball here and
    # exported GOROOT pointing at it. That install went stale (1.25.6) and,
    # still first on PATH with GOROOT pinned, corrupted every build the day
    # a repo required a newer toolchain ("compile: version X does not match
    # go tool version Y"). Homebrew owns the toolchain now; the old install
    # must not linger where it can shadow it.
    - name: Remove legacy pinned Go installation
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/go"
        state: absent

- name: Install Go from tarball (Linux)
  when: ansible_facts["os_family"] != "Darwin"
  block:
    - name: Set Go install directory
      ansible.builtin.set_fact:
        golang_install_dir: "{{ ansible_facts['env']['HOME'] }}/.local/go"

    - name: Check current Go version
      ansible.builtin.command: "{{ golang_install_dir }}/bin/go version"
      register: golang_current_version
      changed_when: false
      failed_when: false

    - name: Set Go platform variables
      ansible.builtin.set_fact:
        golang_arch: "{{ 'arm64' if ansible_facts.architecture in ['arm64', 'aarch64'] else 'amd64' }}"

    - name: Install Go {{ golang_version }}
      when: >-
        golang_current_version.rc != 0 or
        ('go' + golang_version) not in golang_current_version.stdout
      block:
        - name: Remove old Go installation
          ansible.builtin.file:
            path: "{{ golang_install_dir }}"
            state: absent

        - name: Create Go install directory
          ansible.builtin.file:
            path: "{{ golang_install_dir }}"
            state: directory
            mode: "0755"

        - name: Download Go tarball
          ansible.builtin.get_url:
            url: "https://go.dev/dl/go{{ golang_version }}.linux-{{ golang_arch }}.tar.gz"
            dest: "/tmp/go{{ golang_version }}.tar.gz"
            mode: "0644"

        - name: Extract Go tarball to install directory
          ansible.builtin.command:
            cmd: tar zxf /tmp/go{{ golang_version }}.tar.gz --strip-components=1 -C {{ golang_install_dir }}
            creates: "{{ golang_install_dir }}/bin/go"

        - name: Remove downloaded tarball
          ansible.builtin.file:
            path: "/tmp/go{{ golang_version }}.tar.gz"
            state: absent
