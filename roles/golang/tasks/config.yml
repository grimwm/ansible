---
- name: Ensure ~/.bashrc.d exists (POSIX shells / bash)
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d"
    state: directory
    mode: "0755"
  when: ansible_facts["os_family"] != "Windows"

- name: Deploy Go shell configuration for zsh
  ansible.builtin.copy:
    src: golang.zsh
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc.d/golang.zsh"
    mode: "0644"
  when: ansible_facts["os_family"] != "Windows"

- name: Deploy Go shell configuration for bash
  ansible.builtin.copy:
    src: golang.zsh
    dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d/golang.sh"
    mode: "0644"
  when: ansible_facts["os_family"] != "Windows"

- name: Set GOROOT environment variable (Windows)
  ansible.windows.win_environment:
    name: GOROOT
    value: "{{ golang_install_dir }}"
    level: user
    state: present
  when: ansible_facts["os_family"] == "Windows"

- name: Add Go to PATH (Windows)
  ansible.windows.win_path:
    elements:
      - "{{ golang_install_dir }}\\bin"
      - "{{ ansible_facts['env']['USERPROFILE'] }}\\go\\bin"
    scope: user
    state: present
  when: ansible_facts["os_family"] == "Windows"
