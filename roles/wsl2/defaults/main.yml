---
# Distribution installed via `wsl --install -d <name>`.
# The bare "Ubuntu" name always tracks the newest stable Ubuntu LTS. Pin to a
# specific release (e.g. "Ubuntu-24.04") if you need reproducibility.
# Use `wsl --list --online` on the host to see valid names.
wsl_default_distribution: "Ubuntu"

# Written to %USERPROFILE%\.wslconfig
wsl_config:
  memory: "4GB"
  processors: 2
  swap: "2GB"
  localhostForwarding: true
