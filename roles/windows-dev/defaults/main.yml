---
# winget package IDs to install on Windows dev machines.
# Find IDs with: winget search <name>
windows_dev_packages:
  - Microsoft.WindowsTerminal
  - Git.Git
  - Microsoft.VisualStudioCode
  - Docker.DockerDesktop
  - Postman.Postman
  - 7zip.7zip
  - Notepad++.Notepad++

# Directories created under the user profile.
windows_dev_directories:
  - "Documents\Repositories"
  - "Documents\WSL"

# Install dir under %LOCALAPPDATA% for Watch-OutlookGraph.ps1
windows_dev_outlook_monitor_dir: "Watch-OutlookGraph"

# User PATH shim directory under %USERPROFILE% (Watch-OutlookGraph.cmd)
windows_dev_bin_dir: "bin"
