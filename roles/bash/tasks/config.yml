---
- name: Ensure ~/.bashrc.d/ exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d"
    state: directory
    mode: "0755"
  when: ansible_facts["os_family"] != "Windows"

- name: Add sourcing loop to ~/.bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - source ~/.bashrc.d"
    block: |
      for f in ~/.bashrc.d/*.sh; do [ -r "$f" ] && source "$f"; done
    create: true
    mode: "0644"
  when: ansible_facts["os_family"] != "Windows"

# Login shells (macOS Terminal, iTerm) read ~/.bash_profile and never ~/.bashrc.
- name: Source ~/.bashrc from ~/.bash_profile
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bash_profile"
    marker: "# {mark} ANSIBLE MANAGED - source ~/.bashrc"
    block: |
      if [ -r ~/.bashrc ]; then . ~/.bashrc; fi
    create: true
    mode: "0644"
  when: ansible_facts["os_family"] != "Windows"

- name: Deploy base bash config
  ansible.builtin.copy:
    src: base.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d/base.sh"
    mode: "0644"
  when: ansible_facts["os_family"] != "Windows"
