# Every tmux pane runs in its own tmux-spawn-*.scope. When the kernel OOM-kills
# one process in a pane (a runaway test), keep the rest of the pane (an editor,
# an agent session, the shell) instead of stopping the whole scope, and cap a
# pane at 75% of RAM so a runaway is killed inside its pane before the whole
# machine runs out.
[Scope]
OOMPolicy=continue
MemoryMax=75%
