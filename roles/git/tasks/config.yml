---
# The zsh/bash roles normally create these, but they are skipped when a run is
# narrowed with --tags, and copy will not create parent directories.
- name: Ensure shell drop-in directories exist
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .zshrc.d
    - .bashrc.d
  when: ansible_facts["os_family"] != "Windows"

- name: Deploy git prompt for zsh
  ansible.builtin.copy:
    src: git-prompt.zsh
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc.d/git-prompt.zsh"
    mode: "0644"
  when: ansible_facts["os_family"] != "Windows"

- name: Deploy git prompt for bash
  ansible.builtin.copy:
    src: git-prompt.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d/git-prompt.sh"
    mode: "0644"
  when: ansible_facts["os_family"] != "Windows"
