---
- name: Ensure ~/.bashrc.d exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d"
    state: directory
    mode: "0755"
  when: ansible_facts["os_family"] != "Windows"

- name: Add sourcing loop to ~/.bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - source ~/.bashrc.d"
    block: |
      for f in ~/.bashrc.d/*.sh; do [ -r "$f" ] && source "$f"; done
    create: true
    mode: "0644"
  when: ansible_facts["os_family"] != "Windows"

- name: Deploy git prompt for zsh
  ansible.builtin.copy:
    src: git-prompt.zsh
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc.d/git-prompt.zsh"
    mode: "0644"
  when: ansible_facts["os_family"] != "Windows"

- name: Deploy git prompt for bash
  ansible.builtin.copy:
    src: git-prompt.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d/git-prompt.sh"
    mode: "0644"
  when: ansible_facts["os_family"] != "Windows"
