---
- name: Configure git user name
  community.general.git_config:
    name: user.name
    value: "{{ git_user_name }}"
    scope: global
  when: git_user_name is defined

- name: Configure git user email
  community.general.git_config:
    name: user.email
    value: "{{ git_user_email }}"
    scope: global
  when: git_user_email is defined

- name: Configure git aliases
  community.general.git_config:
    name: "alias.{{ item.alias }}"
    value: "{{ item.command }}"
    scope: global
  loop: "{{ git_aliases }}"

- name: Set git default branch to main
  community.general.git_config:
    name: init.defaultBranch
    value: main
    scope: global

- name: Use merge (not rebase) for git pull
  community.general.git_config:
    name: pull.rebase
    value: "false"
    scope: global

- name: Enable colored git output
  community.general.git_config:
    name: color.ui
    value: auto
    scope: global

- name: Prune deleted remote branches on fetch
  community.general.git_config:
    name: fetch.prune
    value: "true"
    scope: global
