---
- name: Check if rustup is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup"
  register: rust_rustup_bin

- name: Install Rust via rustup
  when: not rust_rustup_bin.stat.exists
  block:
    - name: Download the rustup installer
      ansible.builtin.get_url:
        url: https://sh.rustup.rs
        dest: /tmp/rustup-init.sh
        mode: "0755"

    - name: Run the rustup installer
      ansible.builtin.command:
        cmd: sh /tmp/rustup-init.sh -y
        creates: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup"

    - name: Remove the rustup installer
      ansible.builtin.file:
        path: /tmp/rustup-init.sh
        state: absent
